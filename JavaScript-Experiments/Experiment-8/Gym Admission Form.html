<!-- access and validate form fields using events:
design a gym admission form with live input checks.

full Name
email
phone number
age
membership plan dropdown

value , addevent addEventListener
input
change -->
<html>
    <head>
        <title>Gym Admission Form</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f2f2f2;
                text-align: center;
                padding: 40px;
            }
            h2 {
                color: #1a5cff;
            }
            form {
                max-width: 320px;
                margin: 20px auto;
                background-color: white;
                padding: 20px;
                border-radius: 6px;
                border: 1px solid #ccc;
                text-align: left;
            }
            label {
                display: block;
                margin-top: 12px;
                font-size: 14px;
                color: #333;
            }
            input, select {
                width: 100%;
                padding: 8px;
                margin-top: 4px;
                border: 1px solid #ccc;
                border-radius: 4px;
                box-sizing: border-box;
                font-size: 14px;
            }
            .error {
                color: red;
                font-size: 12px;
                margin-top: 3px;
                display: block;
            }
            button {
                margin-top: 18px;
                width: 100%;
                padding: 9px;
                background-color: #1a5cff;
                color: white;
                border: none;
                border-radius: 4px;
                font-size: 15px;
                cursor: pointer;
            }
            button:hover {
                background-color: #0d3fb0;
            }
            #successMsg {
                color: green;
                margin-top: 15px;
                font-size: 15px;
            }
        </style>
    </head>
    <body>

        <h2>Gym Admission Form</h2>
        <label>Sanvi Wadhankar 24070521191</label>

        <form id="gymForm">

            <label for="fullName">Full Name</label>
            <input type="text" id="fullName">
            <span class="error" id="nameError"></span>

            <label for="email">Email</label>
            <input type="text" id="email">
            <span class="error" id="emailError"></span>

            <label for="phone">Phone Number</label>
            <input type="text" id="phone" maxlength="10">
            <span class="error" id="phoneError"></span>

            <label for="age">Age</label>
            <input type="number" id="age">
            <span class="error" id="ageError"></span>

            <label for="plan">Membership Plan</label>
            <select id="plan">
                <option value="">-- Select a Plan --</option>
                <option value="Basic">Basic</option>
                <option value="Standard">Standard</option>
                <option value="Premium">Premium</option>
            </select>
            <span class="error" id="planError"></span>

            <button type="button" onclick="submitForm()">Submit</button>

            <p id="successMsg"></p>

        </form>

        <script>
            // Grabbing all fields using DOM
            var nameField = document.getElementById("fullName");
            var emailField = document.getElementById("email");
            var phoneField = document.getElementById("phone");
            var ageField = document.getElementById("age");
            var planField = document.getElementById("plan");

            // ---------- VALIDATION FUNCTIONS ----------

            function validateName() {
                if (nameField.value.trim() === "") {
                    document.getElementById("nameError").innerHTML = "Please enter your full name";
                    return false;
                } else {
                    document.getElementById("nameError").innerHTML = "";
                    return true;
                }
            }

            function validateEmail() {
                var email = emailField.value;
                // must contain @, no spaces, and end with .com
                var emailPattern = /^[^\s@]+@[^\s@]+\.com$/;

                if (!emailPattern.test(email)) {
                    document.getElementById("emailError").innerHTML = "Enter a valid email";
                    return false;
                } else {
                    document.getElementById("emailError").innerHTML = "";
                    return true;
                }
            }

            function validatePhone() {
                var phone = phoneField.value;
                var phonePattern = /^[0-9]{10}$/;

                if (!phonePattern.test(phone)) {
                    document.getElementById("phoneError").innerHTML = "Enter valid 10 digit number";
                    return false;
                } else {
                    document.getElementById("phoneError").innerHTML = "";
                    return true;
                }
            }

            function validateAge() {
                var age = Number(ageField.value);

                if (ageField.value === "" || age < 16 || age > 60) {
                    document.getElementById("ageError").innerHTML = "Age must be between 16 and 60";
                    return false;
                } else {
                    document.getElementById("ageError").innerHTML = "";
                    return true;
                }
            }

            function validatePlan() {
                if (planField.value === "") {
                    document.getElementById("planError").innerHTML = "Please select a membership plan";
                    return false;
                } else {
                    document.getElementById("planError").innerHTML = "";
                    return true;
                }
            }

            // ---------- LIVE VALIDATION USING EVENTS ----------

            nameField.addEventListener("input", validateName);
            emailField.addEventListener("input", validateEmail);
            phoneField.addEventListener("input", validatePhone);
            ageField.addEventListener("input", validateAge);
            planField.addEventListener("change", validatePlan);

            // ---------- FORM SUBMISSION ----------

            function submitForm() {
                var isNameValid = validateName();
                var isEmailValid = validateEmail();
                var isPhoneValid = validatePhone();
                var isAgeValid = validateAge();
                var isPlanValid = validatePlan();

                if (isNameValid && isEmailValid && isPhoneValid && isAgeValid && isPlanValid) {
                    document.getElementById("successMsg").innerHTML =
                        "Form submitted successfully! Welcome, " + nameField.value + ".";
                } else {
                    document.getElementById("successMsg").innerHTML = "";
                    alert("Please correct the highlighted errors before submitting.");
                }
            }
        </script>

    </body>
</html>
